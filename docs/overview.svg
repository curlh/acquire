<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <style>
    .t { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .s { fill: #59636e; font-size: 12.5px; }
    .lbl { fill: #59636e; font-size: 12px; font-style: italic; }
    .yours { fill: #ffffff; stroke: #1f2328; stroke-width: 1.4; }
    .core { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.6; }
    .part { fill: #ffffff; stroke: #0969da; stroke-width: 1.2; }
    .hw { fill: none; stroke: #b7c0c8; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .arrow { stroke: #1f2328; stroke-width: 1.4; fill: none; marker-end: url(#head); }
    .head { fill: #1f2328; }
    .name { fill: #0969da; font-size: 17px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #e6edf3; }
      .s, .lbl { fill: #9198a1; }
      .yours { fill: #0d1117; stroke: #e6edf3; }
      .core { fill: #0c2d6b; stroke: #4493f8; }
      .part { fill: #0d1117; stroke: #4493f8; }
      .hw { stroke: #4d555e; }
      .arrow { stroke: #e6edf3; }
      .head { fill: #e6edf3; }
      .name { fill: #4493f8; }
    }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- what the lab writes, on top -->
  <rect class="yours" x="40" y="20" width="310" height="56" rx="6"/>
  <text class="t" x="56" y="44">Your experiment</text>
  <text class="s" x="56" y="63">Plan, events, hooks</text>
  <rect class="yours" x="410" y="20" width="310" height="56" rx="6"/>
  <text class="t" x="426" y="44">Your interface</text>
  <text class="s" x="426" y="63">window, controls, display</text>


  <!-- acquire -->
  <rect class="core" x="40" y="130" width="680" height="176" rx="8"/>
  <text class="name" x="56" y="153">acquire</text>
  <path class="arrow" d="M195,76 V166"/>
  <text class="lbl" x="205" y="108">events</text>
  <path class="arrow" d="M565,76 V166"/>
  <text class="lbl" x="575" y="108">live view, device calls</text>
  <rect class="part" x="60" y="168" width="270" height="48" rx="5"/>
  <text class="t" x="74" y="189">Queue</text>
  <text class="s" x="74" y="206">events, added at any time</text>
  <rect class="part" x="430" y="168" width="270" height="48" rx="5"/>
  <text class="t" x="444" y="189">Microscope</text>
  <text class="s" x="444" y="206">hardware thread, live view</text>

  <path class="arrow" d="M195,216 V236"/>
  <path class="arrow" d="M480,216 V236"/>

  <rect class="part" x="60" y="238" width="460" height="52" rx="5"/>
  <text class="t" x="74" y="260">Engine</text>
  <text class="s" x="74" y="278">timing, changed settings only, triggered sequences, restores state</text>
  <path class="arrow" d="M520,264 H558"/>
  <rect class="part" x="560" y="238" width="140" height="52" rx="5"/>
  <text class="t" x="574" y="260">Sink</text>
  <text class="s" x="574" y="278">OME-TIFF, raw</text>

  <!-- drivers and hardware below -->
  <path class="arrow" d="M290,290 V344"/>
  <rect class="yours" x="40" y="346" width="680" height="56" rx="6"/>
  <text class="t" x="56" y="370">Your drivers</text>
  <text class="s" x="56" y="389">one small trait per device: Camera, Stage, XyStage, Shutter, Presets, Properties</text>

  <path class="arrow" d="M120,402 V438"/>
  <path class="arrow" d="M293,402 V438"/>
  <path class="arrow" d="M467,402 V438"/>
  <path class="arrow" d="M640,402 V438"/>
  <rect class="hw" x="40" y="440" width="160" height="40" rx="6"/>
  <text class="s" x="120" y="465" text-anchor="middle">Cameras</text>
  <rect class="hw" x="213" y="440" width="160" height="40" rx="6"/>
  <text class="s" x="293" y="465" text-anchor="middle">Stages</text>
  <rect class="hw" x="387" y="440" width="160" height="40" rx="6"/>
  <text class="s" x="467" y="465" text-anchor="middle">Shutters</text>
  <rect class="hw" x="560" y="440" width="160" height="40" rx="6"/>
  <text class="s" x="640" y="465" text-anchor="middle">Lasers, LEDs, filters</text>
</svg>
